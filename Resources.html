<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST Request</title>
</head>
<body>

    <h1>Create a New Post</h1>

    <form id="postForm">
        <input
            type="text"
            id="title"
            placeholder="Post title"
            required
        >
        <br><br>

        <textarea
            id="body"
            placeholder="Post content"
            required
        ></textarea>
        <br><br>

        <input
            type="number"
            id="userId"
            placeholder="User ID"
            required
        >
        <br><br>

        <button type="submit">Create Post</button>
    </form>

    <h2>Result</h2>
    <pre id="result"></pre>

    <script src="Resources.js"></script>

</body>
</html>
